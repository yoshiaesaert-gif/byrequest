# Render Blueprint: the web app on a Standard Docker instance (2 GB, no sleeping, deploys without downtime),
# the database on Neon and deliveries in Cloudflare R2. Keep plan in step with the dashboard: a Blueprint sync
# applies what is written here.
services:
  - type: web
    name: byrequest
    runtime: docker
    plan: standard
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # Neon connection string, with ?sslmode=require
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CONFIDENTIAL_KEY
        generateValue: true
      - key: SANDBOX_WEBHOOK_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: DEV_SHOW_CODE
        value: "1"
      - key: BRQ_PROVIDER_ENV
        value: test
      - key: STORAGE_DIR
        value: /app/storage
      - key: STORAGE_KEY           # encrypts files in the bucket; never change it once files exist
        generateValue: true
      - key: S3_ENDPOINT           # https://<account id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: BRQ_IDENTITY_PROVIDER # didit in production; set in the dashboard, never by a Blueprint sync
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY        # Web Push keys for phone and browser notifications; set in the dashboard
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: ByRequest <code@byrequest.me>
